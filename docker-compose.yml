version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: alfabetizalibras_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1
      POSTGRES_DB: alfabetizalibras
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: alfabetizalibras_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc:latest
    container_name: alfabetizalibras_create_buckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin) do echo 'Waiting for MinIO...'; sleep 1; done;
      /usr/bin/mc mb myminio/alfabetizalibras;
      /usr/bin/mc anonymous set public myminio/alfabetizalibras;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
